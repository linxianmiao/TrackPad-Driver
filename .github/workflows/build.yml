name: Validate native PTP driver

on:
  pull_request:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: Core tests and simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Test shared C core
        run: make -C core test

      - name: Test driver source contracts
        run: node scripts/check-driver-contracts.mjs

      - name: Build simulator
        working-directory: simulator
        run: |
          npm ci
          npm run build

  diagnostics-x64:
    name: Build read-only x64 diagnostics
    needs: portable-core
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build read-only HID capability probe
        run: >-
          msbuild.exe .\tools\windows\MagicPadHidProbe\MagicPadHidProbe.vcxproj
          -p:Configuration=Release -p:Platform=x64

      - name: Stage read-only bring-up tools
        shell: bash
        run: |
          mkdir diagnostics
          cp tools/windows/MagicPadHidProbe/build/x64/Release/MagicPadHidProbe.exe diagnostics/
          cp scripts/windows/Collect-MagicTrackpadDiagnostics.ps1 diagnostics/
          (cd diagnostics && sha256sum MagicPadHidProbe.exe Collect-MagicTrackpadDiagnostics.ps1 > SHA256SUMS.txt)

      - name: Upload read-only bring-up tools
        uses: actions/upload-artifact@v4
        with:
          name: magicpad-x64-read-only-diagnostics
          path: diagnostics/

  legacy-compile:
    name: Compile quarantined legacy sources
    runs-on: windows-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        #with:
        #  repository: vitoplantamura/MagicTrackpad2ForWindows
        #  ref: master

      - name: Create Source Tarball
        shell: bash
        id: create_tarball
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          mkdir .tarball
          tar -czf .tarball/source-${COMMIT_SHA}.tar.gz --exclude='.git' --exclude='.tarball' .

      - name: Upload Source Tarball
        uses: actions/upload-artifact@v4
        with:
          name: source-code-${{ steps.create_tarball.outputs.commit_sha }}
          path: .tarball/source-${{ steps.create_tarball.outputs.commit_sha }}.tar.gz

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          # The NuGet WDK currently ships DriverKit tasks for MSBuild 17.
          # MSBuild 18 looks for a non-existent *.18.0.dll and fails before
          # compiling any source, so keep this quarantined compile on VS 2022.
          vs-version: '[17.0,18.0)'

      - name: Restore NuGet Packages
        run: |
          nuget restore ./AmtPtpDeviceUsbUm/MagicTrackpad2PtpDevice.vcxproj -PackagesDirectory ${{ github.workspace }}\packages
          nuget restore ./AmtPtpHidFilter/AmtPtpHidFilter.vcxproj -PackagesDirectory ${{ github.workspace }}\packages
          
      - name: Compile legacy drivers (no package output)
        shell: bash
        run: |
          sed -i 's|</TimeStampServer>|</TimeStampServer><ApiValidator_Enable>false</ApiValidator_Enable>|g' ./AmtPtpDeviceUsbUm/MagicTrackpad2PtpDevice.vcxproj
          sed -i 's|</TimeStampServer>|</TimeStampServer><ApiValidator_Enable>false</ApiValidator_Enable>|g' ./AmtPtpHidFilter/AmtPtpHidFilter.vcxproj
          msbuild.exe ./AmtPtpDeviceUsbUm/MagicTrackpad2PtpDevice.vcxproj -p:Configuration=Release -p:Platform=x64
          msbuild.exe ./AmtPtpHidFilter/AmtPtpHidFilter.vcxproj -p:Configuration=Release -p:Platform=x64
          msbuild.exe ./AmtPtpDeviceUsbUm/MagicTrackpad2PtpDevice.vcxproj -p:Configuration=Release -p:Platform=ARM64
          msbuild.exe ./AmtPtpHidFilter/AmtPtpHidFilter.vcxproj -p:Configuration=Release -p:Platform=ARM64
          msbuild.exe ./AmtPtpControlPanel/AmtPtpControlPanel.csproj -p:Configuration=Release -p:Platform=AnyCPU
